<div class="form-container">
  <h2>Nuevo Registro de Persona</h2>
  
  <div *ngIf="mensajeError" class="error-alert">
    {{ mensajeError }}
  </div>

  <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">
    <!-- Datos Personales -->
    <fieldset>
      <legend>Información Personal</legend>
      
      <div class="form-row">
        <div class="form-group">
          <label>Nombre *</label>
          <input type="text" formControlName="nombre" class="form-control" />
        </div>
        <div class="form-group">
          <label>Apellido *</label>
          <input type="text" formControlName="apellido" class="form-control" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Ciudad *</label>
          <input type="text" formControlName="ciudad" class="form-control" />
        </div>
        <div class="form-group">
          <label>Ocupación *</label>
          <select formControlName="ocupacion" class="form-control">
            <option value="">-- Selecciona --</option>
            <option *ngFor="let o of ocupaciones" [value]="o">{{ o }}</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Género *</label>
          <select formControlName="genero" class="form-control">
            <option value="">-- Selecciona --</option>
            <option value="Masculino">Masculino</option>
            <option value="Femenino">Femenino</option>
            <option value="Otro">Otro</option>
          </select>
        </div>
        <div class="form-group">
          <label>Fecha de Nacimiento *</label>
          <input type="date" formControlName="fechaNacimiento" class="form-control" />
        </div>
      </div>

      <div class="form-group">
        <label>Dirección</label>
        <input type="text" formControlName="direccion" class="form-control" />
      </div>
    </fieldset>

    <!-- Contacto Principal y Adicionales -->
    <fieldset>
      <legend>Contacto (Máx. 2 emails / 2 teléfonos)</legend>
      
      <div class="form-row">
        <div class="form-group">
          <label>Email Principal *</label>
          <input type="email" formControlName="email" class="form-control" />
        </div>
        <div class="form-group">
          <label>Teléfono Principal (10 dígitos) *</label>
          <input type="text" formControlName="telefono" class="form-control" />
        </div>
      </div>

      <!-- Emails Adicionales -->
      <div formArrayName="correosAdicionales" class="dynamic-section">
        <div *ngFor="let correo of correosAdicionales.controls; let i = index" class="dynamic-row">
          <input [formControlName]="i" type="email" placeholder="Email Secundario" class="form-control" />
          <button type="button" (click)="eliminarCorreo(i)" class="btn-remove">Quitar</button>
        </div>
        <button type="button" (click)="agregarCorreo()" *ngIf="correosAdicionales.length < 1" class="btn-add">
          + Agregar Correo Secundario
        </button>
      </div>

      <!-- Teléfonos Adicionales -->
      <div formArrayName="telefonosAdicionales" class="dynamic-section">
        <div *ngFor="let tel of telefonosAdicionales.controls; let i = index" class="dynamic-row">
          <input [formControlName]="i" type="text" placeholder="Teléfono Secundario" class="form-control" />
          <button type="button" (click)="eliminarTelefono(i)" class="btn-remove">Quitar</button>
        </div>
        <button type="button" (click)="agregarTelefono()" *ngIf="telefonosAdicionales.length < 1" class="btn-add">
          + Agregar Teléfono Secundario
        </button>
      </div>
    </fieldset>

    <!-- Contacto de Emergencia -->
    <fieldset class="emergency-fieldset">
      <legend>🚨 Contacto de Emergencia</legend>
      
      <div class="form-row">
        <div class="form-group">
          <label>Nombre Completo *</label>
          <input type="text" formControlName="contactoEmergenciaNombre" class="form-control" />
        </div>
        <div class="form-group">
          <label>Teléfono (10 dígitos) *</label>
          <input type="text" formControlName="contactoEmergenciaTelefono" class="form-control" />
        </div>
        <div class="form-group">
          <label>Parentesco / Relación *</label>
          <input type="text" formControlName="contactoEmergenciaParentesco" class="form-control" />
        </div>
      </div>
    </fieldset>

    <!-- Términos y Acciones -->
    <div class="form-group checkbox-group">
      <label>
        <input type="checkbox" formControlName="aceptaTerminos" />
        Acepto los Términos y Condiciones
      </label>
    </div>

    <div class="form-actions">
      <a routerLink="/dashboard" class="btn-secondary">Cancelar</a>
      <button type="submit" [disabled]="registroForm.invalid" class="btn-primary">Guardar Persona</button>
    </div>
  </form>
</div>
