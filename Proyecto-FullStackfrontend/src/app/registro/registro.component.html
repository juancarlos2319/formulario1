<form (ngSubmit)="onSubmit()" #registroForm="ngForm">
  <!-- Mantiene tus campos de formulario estructurados -->
  <div class="form-container">
    <h2>{{ isEditing ? 'Editar Registro' : 'Nuevo Registro' }}</h2>

    <div class="form-group">
      <label>Correo Electrónico</label>
      <input type="email" name="email" [(ngModel)]="contacto.email" required class="form-control" />
    </div>

    <div class="form-group">
      <label>Teléfono</label>
      <input type="text" name="telefono" [(ngModel)]="contacto.telefono" required class="form-control" />
    </div>

    <div class="form-group">
      <label>Fecha de Nacimiento</label>
      <input type="date" name="fechaNacimiento" [(ngModel)]="contacto.fechaNacimiento" class="form-control" />
    </div>

    <div class="form-group">
      <label>Género</label>
      <select name="genero" [(ngModel)]="contacto.genero" class="form-control">
        <option value="Masculino">Masculino</option>
        <option value="Femenino">Femenino</option>
        <option value="Otro">Otro</option>
      </select>
    </div>

    <div class="form-group">
      <label>Ocupación</label>
      <input type="text" name="ocupacion" [(ngModel)]="contacto.ocupacion" class="form-control" />
    </div>

    <div class="form-group">
      <label>Ciudad</label>
      <input type="text" name="ciudad" [(ngModel)]="contacto.ciudad" class="form-control" />
    </div>

    <div class="form-group">
      <label>Dirección Completa</label>
      <input type="text" name="direccion" [(ngModel)]="contacto.direccion" class="form-control" />
    </div>

    <h3>🚨 Contacto de Emergencia</h3>

    <div class="form-group">
      <label>Nombre Completo</label>
      <input type="text" name="contactoEmergenciaNombre" [(ngModel)]="contacto.contactoEmergenciaNombre" class="form-control" />
    </div>

    <div class="form-group">
      <label>Teléfono de Contacto</label>
      <input type="text" name="contactoEmergenciaTelefono" [(ngModel)]="contacto.contactoEmergenciaTelefono" class="form-control" />
    </div>

    <div class="form-group">
      <label>Parentesco / Relación</label>
      <input type="text" name="contactoEmergenciaParentesco" [(ngModel)]="contacto.contactoEmergenciaParentesco" class="form-control" />
    </div>

    <div class="form-actions" style="margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end;">
      <button type="button" class="btn btn-secondary" (click)="cancelar()">Cancelar</button>
      <button type="submit" class="btn btn-primary">
        {{ isEditing ? 'Actualizar Cambios' : 'Guardar' }}
      </button>
    </div>
  </div>
</form>
