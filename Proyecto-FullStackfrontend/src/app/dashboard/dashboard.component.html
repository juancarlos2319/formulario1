<div class="dashboard-container">
  <div class="dashboard-header">
    <div>
      <h2>Personas Registradas</h2>
      <p class="stats">Activas: <strong>{{ contactos.length }} / 20</strong></p>
    </div>
    <button class="btn-nuevo" routerLink="/registro">+ Nuevo Registro</button>
  </div>

  <div class="cards-grid">
    @for (contacto of contactos; track contacto.id) {
      <app-tarjeta-usuario 
        [usuario]="contacto" 
        (eliminar)="borrarContacto($event)">
      </app-tarjeta-usuario>
    }
  </div>
</div>
