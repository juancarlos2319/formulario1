<div class="form-wrapper">
  <h2>Contactos de emergencia</h2>
  <p class="subtitle">Puedes agregar o eliminar los contactos que necesites mediante el botón inferior.</p>
  
  <p *ngIf="mensajeExito" style="color: green; font-weight: bold;">{{ mensajeExito }}</p>
  <p *ngIf="mensajeError" style="color: red; font-weight: bold;">{{ mensajeError }}</p>

  <form [formGroup]="contactosForm" (ngSubmit)="guardarContactos()">
    
    <div formArrayName="contactos">
      <fieldset 
        class="card-section" 
        *ngFor="let contacto of contactos.controls; let i = index" 
        [formGroupName]="i"
        style="margin-bottom: 20px; border: 1px solid #ddd; padding: 15px; border-radius: 8px;"
      >
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
          <legend style="font-weight: bold;">Contacto {{ i + 1 }}</legend>
          <button 
            type="button" 
            (click)="eliminarContacto(i)" 
            *ngIf="contactos.length > 1"
            style="background-color: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;"
          >
            Eliminar
          </button>
        </div>

        <div class="field">
          <label [for]="'nombre_' + i">Nombre *</label>
          <input [id]="'nombre_' + i" type="text" formControlName="nombre" placeholder="Nombre">
        </div>

        <div class="field">
          <label [for]="'apellido_' + i">Apellido *</label>
          <input [id]="'apellido_' + i" type="text" formControlName="apellido" placeholder="Apellido">
        </div>

        <div class="field">
          <label [for]="'fechaNacimiento_' + i">Fecha de nacimiento *</label>
          <input [id]="'fechaNacimiento_' + i" type="date" formControlName="fechaNacimiento">
        </div>

        <div class="field">
          <label [for]="'genero_' + i">Genero *</label>
          <select [id]="'genero_' + i" formControlName="genero">
            <option value="">Selecciona un genero</option>
            <option value="Masculino">Masculino</option>
            <option value="Femenino">Femenino</option>
          </select>
        </div>

        <div class="field">
          <label [for]="'email_' + i">Correo electronico *</label>
          <input [id]="'email_' + i" type="email" formControlName="email" placeholder="correo@ejemplo.com">
        </div>

        <div class="field">
          <label [for]="'telefono_' + i">Teléfono (10 dígitos) *</label>
          <input [id]="'telefono_' + i" type="tel" formControlName="telefono" placeholder="5512345678">
        </div>

        <div class="field">
          <label [for]="'parentesco_' + i">Parentesco *</label>
          <select [id]="'parentesco_' + i" formControlName="idParentesco">
            <option [ngValue]="null">Selecciona un parentesco</option>
            <option *ngFor="let parentesco of parentescos" [ngValue]="parentesco.id">{{ parentesco.nombre }}</option>
          </select>
        </div>
      </fieldset>
    </div>

    <div style="margin-bottom: 20px;">
      <button 
        type="button" 
        (click)="agregarContacto()"
        style="background-color: #27ae60; color: white; border: none; padding: 10px 18px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%;"
      >
        + Agregar otro contacto
      </button>
    </div>

    <button type="submit" class="btn-submit">
      Guardar y Finalizar
    </button>
  </form>
</div>
