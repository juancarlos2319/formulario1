<div class="form-container">
  <h2>{{ editando ? 'Editar persona' : 'Nuevo Registro de Persona' }}</h2>
  <p *ngIf="cargandoPersona && !mensajeError">Cargando persona...</p>
  
  <div *ngIf="mensajeError" class="error-alert">{{ mensajeError }}</div>

  <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">
    <!-- Datos Personales -->
    <fieldset>
      <legend>Información Personal</legend>
      
      <div class="form-row">
        <div class="form-group">
          <label>Nombre *</label>
          <input type="text" formControlName="nombre" class="form-control" />
        </div>
        <div class="form-group">
          <label>Apellido *</label>
          <input type="text" formControlName="apellido" class="form-control" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Género *</label>
          <select formControlName="genero" class="form-control">
            <option value="">-- Selecciona --</option>
            <option value="Masculino">Masculino</option>
            <option value="Femenino">Femenino</option>
            <option value="Otro">Otro</option>
          </select>
        </div>
        <div class="form-group">
          <label>Fecha de Nacimiento *</label>
          <input type="date" formControlName="fechaNacimiento" class="form-control" />
        </div>
        <div class="form-group">
          <label>Ocupación *</label>
          <select formControlName="ocupacion" class="form-control">
            <option value="">-- Selecciona --</option>
            <option *ngFor="let o of ocupaciones" [value]="o.nombre || o">{{ o.nombre || o }}</option>
          </select>
        </div>
      </div>
    </fieldset>

    <!-- Dirección con CP Autocompletable -->
    <fieldset>
      <legend>Ubicación y Dirección</legend>

      <div class="form-row">
        <div class="form-group">
          <label>Código Postal *</label>
          <input type="text" formControlName="cp" class="form-control" (keyup)="buscarCodigoPostal()" placeholder="5 dígitos" maxlength="5" />
          <small *ngIf="cargandoCP" class="text-muted">Buscando CP...</small>
        </div>
        <div class="form-group">
          <label>País</label>
          <input type="text" formControlName="pais" class="form-control disabled-input" />
        </div>
        <div class="form-group">
          <label>Estado</label>
          <input type="text" formControlName="estado" class="form-control disabled-input" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Municipio / Ciudad</label>
          <input type="text" formControlName="municipio" class="form-control disabled-input" />
        </div>
        <div class="form-group">
          <label>Colonia *</label>
          <select formControlName="colonia" class="form-control">
            <option value="">-- Seleccione Colonia --</option>
            <option *ngFor="let col of colonias" [value]="col">{{ col }}</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group" style="flex: 2;">
          <label>Calle *</label>
          <input type="text" formControlName="calle" class="form-control" />
        </div>
        <div class="form-group" style="flex: 1;">
          <label>Número Ext/Int *</label>
          <input type="text" formControlName="numero" class="form-control" />
        </div>
      </div>
    </fieldset>

    <!-- Contactos -->
    <fieldset>
      <legend>Contacto (Máx. 2 emails / 2 teléfonos)</legend>
      <div class="form-row">
        <div class="form-group">
          <label>Email Principal *</label>
          <input type="email" formControlName="email" class="form-control" />
        </div>
        <div class="form-group">
          <label>Teléfono Principal (10 dígitos) *</label>
          <input type="text" formControlName="telefono" class="form-control" />
        </div>
      </div>

      <div formArrayName="correosAdicionales" class="dynamic-section">
        <div *ngFor="let correo of correosAdicionales.controls; let i = index" class="dynamic-row">
          <input [formControlName]="i" type="email" placeholder="Email Secundario" class="form-control" />
          <button type="button" (click)="eliminarCorreo(i)" class="btn-remove">Quitar</button>
        </div>
        <button type="button" (click)="agregarCorreo()" *ngIf="correosAdicionales.length < 1" class="btn-add">+ Agregar Correo Secundario</button>
      </div>

      <div formArrayName="telefonosAdicionales" class="dynamic-section">
        <div *ngFor="let tel of telefonosAdicionales.controls; let i = index" class="dynamic-row">
          <input [formControlName]="i" type="text" placeholder="Teléfono Secundario" class="form-control" />
          <button type="button" (click)="eliminarTelefono(i)" class="btn-remove">Quitar</button>
        </div>
        <button type="button" (click)="agregarTelefono()" *ngIf="telefonosAdicionales.length < 1" class="btn-add">+ Agregar Teléfono Secundario</button>
      </div>
    </fieldset>


    <div class="form-group checkbox-group" *ngIf="!editando">
      <label>
        <input type="checkbox" formControlName="aceptaTerminos" />
        Acepto los Términos y Condiciones
      </label>
    </div>

    <div class="form-actions">
      <a routerLink="/dashboard" class="btn-secondary">Cancelar</a>
      <button type="submit" [disabled]="registroForm.invalid || cargandoPersona || guardando" class="btn-primary">
        {{ guardando ? 'Guardando...' : (editando ? 'Guardar cambios' : 'Guardar Persona') }}
      </button>
    </div>
  </form>
</div>
