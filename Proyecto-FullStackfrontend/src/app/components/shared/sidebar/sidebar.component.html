  <aside class="sidebar" aria-label="Navegación principal">
    <a class="brand" routerLink="/dashboard"><span class="mark">P</span>Portal<span>System</span></a>
    <div class="workspace"><span class="tile">PS</span><div><small>Espacio de trabajo</small><strong>Administración de personas</strong></div></div>
    <span class="eyebrow">MENÚ PRINCIPAL</span>
    <nav>
      <a routerLink="/dashboard" routerLinkActive="active" ariaCurrentWhenActive="page"><span aria-hidden="true">▦</span> Resumen</a>
      <a routerLink="/personas" routerLinkActive="active" ariaCurrentWhenActive="page"><span aria-hidden="true">♙</span> Personas</a>
      <a routerLink="/registro" routerLinkActive="active" ariaCurrentWhenActive="page"><span aria-hidden="true">＋</span> Registro</a>
    </nav>
    <div class="session">
      <section class="account-data">
        <strong>{{ usuarioActual()?.nombre || 'Cuenta' }}</strong>
        <small *ngIf="usuarioActual()?.correo">{{ usuarioActual()?.correo }}</small>
        <small *ngIf="cargandoCuenta()" role="status">Cargando cuenta...</small>
        <small *ngIf="errorCuenta()" role="alert">No se pudieron cargar tus datos.</small>
      </section>
      <button type="button" disabled title="Disponible en el punto de edición de cuenta">Editar cuenta</button>
      <button type="button" (click)="logout()">Cerrar sesión</button>
    </div>
  </aside>
